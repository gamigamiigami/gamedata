<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IOgames | メインポータル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;family=Saira+Condensed:wght@500;700&amp;display=swap" />
    <link rel="stylesheet" href="shared/design.css" />
    <link rel="stylesheet" href="mainportal.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="top-bar">
      <span class="logo">IO<span>games</span></span>
      <div class="top-bar__right">
        <a href="teachers/index.html" class="top-link top-link--teacher">先生の方へ →</a>
        <div id="schoolLoginArea"></div>
      </div>
    </header>

    <main>
      <h2 class="page-title">メインポータル</h2>

      <!-- 状況バー（マイページ／今日のチャレンジ） -->
      <div class="status-bar">
        <a href="mypage/index.html" id="mypageCard" class="status-row">
          <span id="mypageMascot" class="status-mascot"></span>
          <span class="status-row__label">マイページ</span>
          <span id="mypageInfo" class="status-row__main">レベル・称号・間違いノート</span>
          <span class="status-row__sub" id="mypageLevel"></span>
        </a>
        <div id="challengeCard" class="status-row status-row--challenge" style="display:none;">
          <span class="status-mascot" aria-hidden="true"></span>
          <span class="status-row__label">今日の目標</span>
          <span class="status-row__main" id="challengeText"></span>
          <span class="status-row__sub" id="challengeDone"></span>
        </div>
      </div>

      <!-- 教科選択 -->
      <div class="container">
        <button class="portal-button" data-url="kokugo/index.html"><span class="pb-jp">国語</span><span class="pb-en">Japanese</span></button>
        <button class="portal-button" data-url="rika/index.html"><span class="pb-jp">理科</span><span class="pb-en">Science</span></button>
        <button class="portal-button" data-url="english/index.html"><span class="pb-jp">英語</span><span class="pb-en">English</span></button>
        <button class="portal-button" data-url="math/index.html"><span class="pb-jp">数学</span><span class="pb-en">Math</span></button>
        <button class="portal-button" data-url="syakai/index.html"><span class="pb-jp">社会</span><span class="pb-en">Social</span></button>
        <button class="portal-button" data-url="kateika/index.html"><span class="pb-jp">家庭科</span><span class="pb-en">Home</span></button>
        <button class="portal-button" data-url=""><span class="pb-jp">準備中</span></button>
      </div>
    </main>

    <script src="mainportal.js"></script>
    <script>
      (function () {
        var area = document.getElementById('schoolLoginArea');
        var code = localStorage.getItem('schoolCode');
        var name = localStorage.getItem('schoolName');
        // QR経由: ?school=XXXX-XXXX-XXXX
        var urlCode = new URLSearchParams(location.search).get('school');
        if (urlCode && !code) {
          location.href = 'school-login/?code=' + encodeURIComponent(urlCode);
          return;
        }
        if (code) {
          area.innerHTML =
            '<span class="school-badge">' +
            '<span class="school-badge__label">学校</span>' +
            '<b>' + name.replace(/</g,'&lt;') + '</b>' +
            '<a href="school-login/">変更</a>' +
            '</span>';
          // 学校専用/先生管理ボタンを教科グリッドに追加
          var isTeacher = localStorage.getItem('teacherRole') === 'teacher';
          var schoolBtn = document.createElement('button');
          schoolBtn.className = 'portal-button portal-button--school';
          schoolBtn.dataset.url = isTeacher ? 'teacher-games/index.html' : 'school-games/index.html';
          schoolBtn.style.setProperty('--c', isTeacher ? '#3d3dbb' : '#e05545');
          schoolBtn.innerHTML = isTeacher
            ? '<span class="pb-jp">先生管理</span><span class="pb-en">Teacher</span>'
            : '<span class="pb-jp">学校専用</span><span class="pb-en">School</span>';
          document.querySelector('.container').appendChild(schoolBtn);
        } else {
          area.innerHTML = '<a href="school-login/" class="top-link">学校ログイン</a>';
        }
      })();
    </script>
    <script type="module">
      import { getProgress, levelInfo, getTodayChallenge, subjectName } from "./shared/progress.js";
      import { mascotSVG } from "./shared/mascot.js";

      /* マイページ行（レベル・連続日数・称号数） */
      const p = getProgress();
      const lv = levelInfo(p.xp);
      document.getElementById("mypageMascot").innerHTML = mascotSVG({ mood: "normal", level: lv.level, size: 30 });
      const bits = [];
      if (p.streak.count >= 2) bits.push(p.streak.count + "日連続");
      const badgeNum = Object.keys(p.badges).length;
      if (badgeNum > 0) bits.push("称号 " + badgeNum + "個");
      document.getElementById("mypageInfo").textContent =
        bits.length ? bits.join("　/　") : "レベル・称号・間違いノート";
      document.getElementById("mypageLevel").textContent = "レベル " + lv.level;

      /* 今日の目標 */
      const ch = getTodayChallenge();
      const card = document.getElementById("challengeCard");
      const link = document.createElement("a");
      link.href = encodeURI(ch.p);
      link.className = "status-row status-row--challenge" + (ch.done ? " status-row--done" : "");
      link.innerHTML = card.innerHTML;
      card.replaceWith(link);
      document.getElementById("challengeText").textContent =
        `「${ch.t}」で ${ch.goal} 問正解しよう（${subjectName(ch.s)}）`;
      document.getElementById("challengeDone").textContent = ch.done ? "達成ずみ" : "+50XP";
    </script>
  </body>
</html>
